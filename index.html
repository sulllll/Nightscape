  // Every note builds a small graph. When all its oscillators end, it disconnects
  // all of it, including the link from the shared wow, so nothing builds up over
  // hours of play.
  let live = 0, made = 0, on = true;
  function voice(oscs, nodes) {
    live++; made++;
    let left = oscs.length;
    for (const o of oscs) o.onended = () => {
      if (--left) return;
      for (const x of oscs) { try { wow.disconnect(x.detune); } catch (e) {} x.disconnect(); }
      for (const n of nodes) n.disconnect();
      live--;
    };
  }
  function osc(type, f, cents, t, stop) {
    const o = ctx.createOscillator();
    o.type = type; o.frequency.value = f; o.detune.value = cents;
    wow.connect(o.detune);
    o.start(t); o.stop(stop);
    return o;
  }
  function pan(p) {
    if (!ctx.createStereoPanner) return ctx.createGain();
    const n = ctx.createStereoPanner(); n.pan.value = Math.max(-1, Math.min(1, p));
    return n;
  }

  // Felt piano: four harmonics, struck softly. Each fades at its own rate, the upper
  // ones first, so the tone darkens as it rings.
  function piano(t, m, v, p) {
    const f = hz(m), lp = bq('lowpass', Math.min(4500, f * 5), 0.3), pn = pan(p), oscs = [], nodes = [lp, pn];
    lp.connect(pn); pn.connect(bus); pn.connect(echo);
    const ring = m < 62 ? 3.6 : m < 70 ? 3.0 : 2.4;
    for (const [r, a, k] of [[1, 1, 1], [2, 0.3, 0.5], [3, 0.1, 0.3], [4.02, 0.04, 0.18]]) {
      const tau = ring * k, g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(a * v, t + 0.015);
      g.gain.setTargetAtTime(0, t + 0.015, tau);
      const o = osc('sine', f * r, range(-3, 3), t, t + 0.015 + tau * 7);
      o.connect(g).connect(lp);
      oscs.push(o); nodes.push(g);
    }
    voice(oscs, nodes);
  }
  // Wordless choir: three slightly detuned saw waves shaped by the formants of a soft
  // "oo", "oh" or "aw". It swells in over a few seconds and fades slowly.
  const VOWELS = [[[300, 1], [870, 0.35], [2240, 0.08]], [[570, 1], [840, 0.55], [2410, 0.07]], [[440, 1], [1020, 0.4], [2240, 0.06]]];
  function choir(t, m, v, p) {
    const f = hz(m), att = range(3, 5), hold = range(3, 6), rel = range(5, 8), end = t + att + hold + rel * 1.75;
    const g = ctx.createGain(), pn = pan(p), pre = bq('lowpass', 2600, 0.5), oscs = [], nodes = [g, pn, pre];
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + att);
    g.gain.setValueAtTime(v, t + att + hold);
    g.gain.setTargetAtTime(0, t + att + hold, rel / 4);
    for (const c of [-8, 0, 7]) { const o = osc('sawtooth', f, c + range(-2, 2), t, end); o.connect(pre); oscs.push(o); }
    for (const [ff, a] of VOWELS[Math.floor(rnd() * VOWELS.length)]) {
      const b = bq('bandpass', ff, ff / 90), fg = ctx.createGain();
      fg.gain.value = a;
      pre.connect(b).connect(fg).connect(g);
      nodes.push(b, fg);
    }
    g.connect(pn).connect(bus);
    voice(oscs, nodes);
  }
  // Low drone: root, sub-octave, fifth and octave, rising and falling so slowly that
  // it is felt more than heard. Each drone note overlaps the next.
  function drone(t, m, v, p, len) {
    const f = hz(m), att = len * 0.35, dur = len * 1.3;
    const g = ctx.createGain(), pn = pan(p), oscs = [], nodes = [g, pn];
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + att);
    g.gain.setValueAtTime(v, t + dur - att);
    g.gain.linearRampToValueAtTime(0, t + dur);
    for (const [type, r, a] of [['sine', 0.5, 0.5], ['sine', 1, 1], ['triangle', 1.5, 0.22], ['sine', 2, 0.25]]) {
      const ag = ctx.createGain();
      ag.gain.value = a;
      const o = osc(type, f * r, range(-4, 4), t, t + dur + 0.1);
      o.connect(ag).connect(g);
      oscs.push(o); nodes.push(ag);
    }
    g.connect(pn).connect(bus);
    voice(oscs, nodes);
  }

  // Sections: which set of notes is in use at a given time. From the first set the
  // music moves to one of the others; from those it usually returns home.
  const t0 = ctx.currentTime, secs = [{ at: -Infinity, set: 0 }];
  let secEnd = t0 + range(SEC[0], SEC[1]);
  function setAt(t) {
    while (t >= secEnd) {
      const cur = secs[secs.length - 1].set;
      let nx = cur === 0 || rnd() < 0.4 ? 1 + Math.floor(rnd() * (SETS.length - 1)) : 0;
      if (nx === cur) nx = 0;
      secs.push({ at: secEnd, set: nx });
      if (secs.length > 6) secs.shift();
      secEnd += range(SEC[0], SEC[1]);
    }
    for (let i = secs.length - 1; i > 0; i--) if (t >= secs[i].at) return secs[i].set;
    return secs[0].set;
  }
  const loops = LOOPS.map(([kind, at, len, lv, rest, p], i) => ({ kind, at, len, lv, rest, p,
    next: t0 + (kind === 'drone' ? 0.5 : i === 4 ? range(1, 3) : range(3, len)) }));
  function play(L, t) {
    let m = SETS[setAt(t)][L.at];
    const v = L.lv * range(0.75, 1);
    if (L.kind === 'piano') {
      if (m < 76 && rnd() < 0.08) m += 12;   // now and then, an octave higher
      piano(t, m, v, L.p + range(-0.1, 0.1));
    } else if (L.kind === 'choir') choir(t, m, v, L.p);
    else drone(t, m, v, L.p, L.len);
  }
  // Schedules every note that starts before `until`. Notes whose time has already
  // passed, for example while the music was off, are skipped, not played late.
  function schedule(until) {
    const now = ctx.currentTime;
    for (const L of loops) {
      while (L.next < until) {
        const t = L.next;
        L.next += L.len * range(0.98, 1.02);
        if (!on || t < now - 0.05 || (L.rest && rnd() < L.rest)) continue;
        play(L, t);
      }
    }
  }
  return { schedule, setOn(b) { on = !!b; }, stats: () => ({ live, made, set: setAt(ctx.currentTime) }) };
}
/* MUSIC-ENGINE-END */

function createCockpitRadio(ctx, out) {
  const clips = Array.from(document.querySelectorAll('[data-cockpit-radio]'), element => {
    // The inline samples are unsigned mono PCM at 8 kHz, already mixed to a quiet level.
    const bytes = atob(element.textContent);
    const buffer = ctx.createBuffer(1, bytes.length, 8000);
    const samples = buffer.getChannelData(0);
    for (let i = 0; i < bytes.length; i++) samples[i] = (bytes.charCodeAt(i) - 128) * (0.046 / 127);
    return buffer;
  });
  let next = ctx.currentTime + 19 + 7 * Math.random();
  let clip = 0;
  return () => {
    const now = ctx.currentTime;
    if (now < next) return;
    next = now + 60 + 34 * Math.random();
    const source = ctx.createBufferSource();
    source.buffer = clips[clip];
    clip = (clip + 1) % clips.length;
    source.connect(out);
    source.onended = () => source.disconnect();
    source.start();
  };
}

function buildAudio() {
  const ctx = new AC();
  const master = ctx.createGain(), comp = ctx.createDynamicsCompressor();
  master.gain.value = 0;
  // a gentle limiter, so overlapping thunder never gets harsh
  comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.03; comp.release.value = 0.8;
  master.connect(comp).connect(ctx.destination);
  const windBus = ctx.createGain(), thunderBus = ctx.createGain();
  windBus.connect(master); thunderBus.connect(master);
  // The wind: pink noise under a slowly moving low-pass is the rush of air, and two
  // narrow band-passes on the same noise, drifting in pitch, are the whistle.
  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(ctx, 12, 'pink'); src.loop = true;
  const rushF = filter(ctx, 'lowpass', 500, 0.5), rushG = ctx.createGain();
  src.connect(rushF).connect(rushG).connect(windBus);
  const wh = [[720, 22], [1170, 30]].map(([f, q]) => {
    const bp = filter(ctx, 'bandpass', f, q), g = ctx.createGain();
    g.gain.value = 0;
    src.connect(bp).connect(g).connect(windBus);
    return { bp, g };
  });
  src.start();
  // The music has its own bus. A timer, not the render loop, schedules it a few
  // seconds ahead, so it keeps playing even if a wallpaper app slows the drawing.
  const musicBus = ctx.createGain();
  musicBus.gain.value = 0;
  musicBus.connect(master);
  const music = createMusic(ctx, musicBus, (Math.random() * 4294967296) >>> 0);
  const scheduleRadio = createCockpitRadio(ctx, master);
  setInterval(() => {
    if (!soundLive()) return;
    music.schedule(ctx.currentTime + 6);
    scheduleRadio();
  }, 1000);
  au = { ctx, master, windBus, thunderBus, musicBus, music, rushF, rushG, wh, brown: noiseBuffer(ctx, 10, 'brown'), nextMod: 0 };
}
function applySoundLevels(fade) {
  if (!au) return;
  const now = au.ctx.currentTime;
  au.master.gain.setTargetAtTime(sound.on ? sound.volume * sound.volume : 0, now, fade || 0.1);
  au.musicBus.gain.setTargetAtTime(sound.music * sound.music * 1.6, now, 0.3);
  au.music.setOn(sound.music > 0);
  au.windBus.gain.setTargetAtTime(sound.wind * sound.wind, now, 0.1);
  au.thunderBus.gain.setTargetAtTime(sound.thunder * sound.thunder * 1.6, now, 0.1);
}
const soundLive = () => !!au && au.ctx.state === 'running' && sound.on && canPlaySound();
function pauseSound() {
  if (au) au.ctx.suspend().then(syncSound, () => {});
}
function startSound() {
  if (!sound.on || DBG || !AC || !canPlaySound()) return;
  if (!au) { try { buildAudio(); } catch (e) { return; } }
  if (au.ctx.state !== 'running') au.ctx.resume().then(() => {
    if (!sound.on || !canPlaySound()) pauseSound();
    else syncSound();
  }, () => {});
  applySoundLevels(1.2);   // fade in over a few seconds
  syncSound();
}
function setSoundOn(on) {
  sound.on = on;
  try { localStorage.setItem(SOUND_STORE, JSON.stringify(sound)); } catch (e) {}
  if (on) startSound();
  else if (au) {
    applySoundLevels(0.25);
    setTimeout(() => { if (!sound.on) pauseSound(); }, 1500);
  }
  syncSound();
}
// any click or key press may start the sound (S is handled by its own toggle)
const soundGesture = e => { if (e.type === 'keydown' && (e.key === 's' || e.key === 'S')) return; if (!soundLive()) startSound(); };
window.addEventListener('pointerdown', soundGesture, true);
window.addEventListener('keydown', soundGesture, true);
function followSoundPage() {
  if (canPlaySound()) startSound();
  else pauseSound();
}
document.addEventListener('visibilitychange', followSoundPage);
window.addEventListener('focus', followSoundPage);
window.addEventListener('blur', () => { if (!wallpaperSound) pauseSound(); });
window.addEventListener('pagehide', () => { soundPageActive = false; pauseSound(); });
window.addEventListener('pageshow', () => { soundPageActive = true; followSoundPage(); });

// Every eighth of a second, steer the wind: gusts from a few slow swells whose periods
// never line up (so the pattern never repeats), with the whistle rising in the gusts.
function updateSound() {
  if (!soundLive()) return;
  const now = au.ctx.currentTime;
  if (now < au.nextMod) return;
  au.nextMod = now + 0.125;
  const t = clock;
  const gust = THREE.MathUtils.clamp(0.5 + 0.22 * Math.sin(t * 0.091 + 1.3) + 0.16 * Math.sin(t * 0.237 + 0.4) + 0.12 * Math.sin(t * 0.561 + 2.2), 0, 1);
  au.rushG.gain.setTargetAtTime(0.45 + 0.55 * gust, now, 0.6);
  au.rushF.frequency.setTargetAtTime(300 + 600 * gust, now, 0.6);
  const rise = THREE.MathUtils.smoothstep(gust, 0.35, 0.9);
  const f0 = 600 + 300 * gust + 35 * Math.sin(t * 0.73);
  au.wh[0].bp.frequency.setTargetAtTime(f0, now, 0.4);
  au.wh[1].bp.frequency.setTargetAtTime(f0 * 1.63 + 25 * Math.sin(t * 0.51 + 1.0), now, 0.4);
  const w = sound.whistle * sound.whistle * 22;
  au.wh[0].g.gain.setTargetAtTime(w * rise * (0.7 + 0.3 * Math.sin(t * 0.31)), now, 0.5);
  au.wh[1].g.gain.setTargetAtTime(w * 0.55 * rise * rise * (0.6 + 0.4 * Math.sin(t * 0.43 + 2.0)), now, 0.5);
}

// Thunder for one flash: brown noise through two low-passes, opening with a soft swell
// and rolling on in a few weaker waves. Distance delays it, makes it quieter and takes
// away more of the higher rumble; a flash deep in the cloud sounds the most muffled.
// It is panned towards the flash.
function thunder(ev) {
  if (!soundLive() || sound.thunder <= 0) return;
  const ctx = au.ctx, cp = camU.uCamPos.value;
  const dx = ev.centre[0] - cp.x, dy = ev.centre[1] - cp.y, dz = ev.centre[2] - cp.z;
  const dist = Math.hypot(dx, dy, dz);
  const kind = ev.deep ? 'deep' : ev.kind;
  const t0 = ctx.currentTime + (0.8 + dist * 0.012) * sound.delay;
  const loud = (kind === 'cg' ? 1 : kind === 'ic' ? 0.8 : 0.7) / (1 + dist / 160);
  const cut = Math.max(130, (kind === 'cg' ? 340 : kind === 'ic' ? 270 : 200) * Math.exp(-dist / 700));
  const T = 4.5 + Math.random() * 3.5 + dist * 0.008;
  const src = ctx.createBufferSource();
  src.buffer = au.brown; src.loop = true;
  const g = ctx.createGain();
  g.gain.value = 0;
  let out = src.connect(filter(ctx, 'lowpass', cut, 0.7)).connect(filter(ctx, 'lowpass', cut * 1.5, 0.5)).connect(g);
  if (ctx.createStereoPanner) {
    const R = camU.uCamR.value, p = ctx.createStereoPanner();
    p.pan.value = THREE.MathUtils.clamp((dx * R.x + dy * R.y + dz * R.z) / dist, -1, 1) * 0.7;
    out = out.connect(p);
  }
  out.connect(au.thunderBus);
  const G = g.gain, att = kind === 'cg' ? 0.15 + Math.random() * 0.15 : 0.35 + Math.random() * 0.4;
  G.setValueAtTime(0, t0);
  G.linearRampToValueAtTime(loud, t0 + att);
  let t = t0 + att;
  const n = 2 + Math.floor(Math.random() * 4), step = (T * 0.75 - att) / n;
  for (let k = 1; k <= n; k++) {
    const peak = loud * Math.pow(1 - k / (n + 1), 1.2) * (0.7 + 0.5 * Math.random());
    G.linearRampToValueAtTime(peak * 0.45, t + step * (0.4 + 0.2 * Math.random()));
    t += step;
    G.linearRampToValueAtTime(peak, t);
  }
  G.setTargetAtTime(0, t, (t0 + T - t) / 3);
  src.start(t0, Math.random() * 8);
  src.stop(t0 + T + 1);
  src.onended = () => g.disconnect();
}

const aOn = document.getElementById('a-on'), aNote = document.getElementById('a-note');
const aSliders = ['volume', 'music', 'wind', 'whistle', 'thunder', 'delay'];
function syncSound() {
  aOn.checked = sound.on;
  for (const k of aSliders) {
    document.getElementById('a-' + k).value = sound[k];
    document.getElementById('a-' + k + '-v').textContent = k === 'delay'
      ? (sound.delay === 0 ? 'none' : '×' + (+sound.delay).toFixed(2))
      : sound[k] === 0 ? 'off' : Math.round(sound[k] * 100) + '%';
  }
  aNote.textContent = !AC ? 'This browser has no Web Audio' : sound.on && !soundLive() ? 'Click anywhere to start sound' : 'S turns sound on or off';
}
function onSoundInput(t) {
  if (t.id === 'a-on') { setSoundOn(t.checked); return; }
  sound[t.id.slice(2)] = parseFloat(t.value);
  try { localStorage.setItem(SOUND_STORE, JSON.stringify(sound)); } catch (e) {}
  applySoundLevels();
  syncSound();
}
syncSound();
// Some browsers allow sound without a click, for example Chrome started with
// --autoplay-policy=no-user-gesture-required as a kiosk or a wallpaper. Try to start
// now; elsewhere the audio waits, suspended, for the first click or key press.
startSound();

/* ---------------------------------------------------------------------------
   Full screen
--------------------------------------------------------------------------- */
function toggleFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement) { (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el); }
  else { (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document); }
}
canvas.addEventListener('dblclick', toggleFullscreen);
window.addEventListener('keydown', e => {
  if (e.target && /input|select|textarea/i.test(e.target.tagName)) return;
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
});

window.__cloudScene = {
  masts: () => groundPass.u.uMast.value.slice(0, groundPass.u.uMastN.value).map(v => v.toArray()),
  setTime: v => { simT = v; }, setClock: v => { clock = v; },
  step: () => { frame++; render(0); renderer.getContext().finish(); },
  // recording: move time on by dt seconds and draw one frame; send a shooting star now
  advance: dt => { simT += dt * (reduceMotion ? 0.35 : 1.0); clock += dt; frame++; render(dt); renderer.getContext().finish(); },
  meteor: fire => { launchMeteor(fire === true); return met.on; },
  farFlash: () => { farFlash(); return Object.assign({}, far.cell); },
  farState: () => ({ on: far.on, u: compPass.u.uFar.value.toArray(), shape: compPass.u.uFarShape.value.toArray(), inShader: !!compPass.u.uFar }),
  // testing: start a flash of a given kind ('cg', 'ic' or 'crawl'), optionally frozen at an age in seconds
  strike: (kind, hold) => { if (flash) endFlash(); return startFlash(kind || 'cg', { hold }); },
  holdFlash: age => { if (flash) flash.hold = age; },
  storms: () => CBS.map(c => ({ x: +c.cx.toFixed(1), z: +c.cz.toFixed(1), R0: +c.R0.toFixed(1), H: +c.H.toFixed(1),
    sdMid: +sdAt(colAt(Object.assign({ x: c.cx, z: c.cz }, c), (LT.BASE + c.H) / 2)).toFixed(2) })),
  peak: k => flash ? flash.strokes[Math.min(k || 0, flash.strokes.length - 1)].t + 0.004 : null,
  lt: () => ({ boltOn: compPass.u.uBoltOn.value, mainE: boltMat.uniforms.uMainE.value, prog: boltMat.uniforms.uProg.value,
    rt: boltRT && [boltRT.width, boltRT.height], li: [lightU.uLi0.value, lightU.uLi1.value], R: Math.sqrt(lightU.uLR2.value),
    seg1: flash && flash.seg1, cam: camPos(), next: +(nextFlash - clock).toFixed(2), inRange: !!pickStorm(null) })
};
})();
